<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Citas · FLiiTS</title>
<meta name="description" content="Elige día y hora y reserva tu cita con FLiiTS en un minuto.">
<meta name="theme-color" content="#0A0A0A">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FLiiTS">
<meta property="og:title" content="Reserva tu cita · FLiiTS">
<meta property="og:description" content="Elige día y hora y reserva tu plaza en un minuto.">
<meta property="og:image" content="https://opsfliits.github.io/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0A0A0A; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #F2F1EC; }
  .carga { position: fixed; inset: 0; z-index: 2; background: #0A0A0A; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center; transition: opacity .25s; }
  .carga.oculta { opacity: 0; pointer-events: none; }
  .logo { font-family: "Unbounded", "Arial Black", Impact, sans-serif; font-weight: 900; font-size: 34px; letter-spacing: .01em; color: #D60505; line-height: 1; }
  .logo span { display: block; margin-top: 10px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; letter-spacing: .18em; color: rgba(255,255,255,.62); }
  .puntos { display: flex; gap: 8px; }
  .puntos i { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: .25; animation: p 1s infinite ease-in-out; }
  .puntos i:nth-child(2) { animation-delay: .15s; }
  .puntos i:nth-child(3) { animation-delay: .3s; }
  @keyframes p { 0%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
  .ayuda { display: none; max-width: 320px; color: rgba(255,255,255,.72); font-size: 14px; line-height: 1.5; }
  .ayuda.ver { display: block; }
  .ayuda a { display: inline-block; margin-top: 12px; color: #fff; background: #D60505; border-radius: 999px; padding: 12px 22px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; }
  @media (prefers-reduced-motion: reduce) { .puntos i { animation: none; opacity: .6; } }
</style>
</head>
<body>
<div class="carga" id="carga" role="status" aria-live="polite">
  <div class="logo">FLiiTS<span>CITAS</span></div>
  <div class="puntos" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="ayuda" id="ayuda">¿No se carga? · Not loading?<br><a id="directo" href="#" target="_top">Abrir · Open</a></div>
</div>
<iframe id="app" title="Citas FLiiTS" allow="clipboard-write"></iframe>
<noscript><p style="color:#fff;text-align:center;padding:40px">Activa JavaScript para reservar tu cita.</p></noscript>
<script>
(function () {
  /* La app de citas (despliegue público de Apps Script). Esta página la muestra a pantalla completa
     y le pasa los parámetros de su dirección: ?m=… (reunión), ?gestionar=… (cita), &lang=… */
  var APP = 'https://script.google.com/macros/s/AKfycbzoKuJA7OBy_LhJ6jC-5Ztlq-5FiSdx7_iKeY5peLOChoeJQUjmgvu-E8cvzKMy3b0x4g/exec';
  var CLAVES = ['m', 'r', 'gestionar', 'cancelar', 'accion', 'hecho', 'lang'];
  var ORIGEN_APP = new URL(APP).origin;

  var carga = document.getElementById('carga');
  var marco = document.getElementById('app');
  var destino = APP + location.search;
  document.getElementById('directo').href = destino;
  marco.src = destino;

  var listo = false;
  function ocultarCarga() {
    if (listo) return;
    listo = true;
    carga.className = 'carga oculta';
    setTimeout(function () { carga.style.display = 'none'; }, 300);
  }
  marco.addEventListener('load', function () { setTimeout(ocultarCarga, 3000); });
  setTimeout(function () { if (!listo) document.getElementById('ayuda').className = 'ayuda ver'; }, 15000);

  /* La app avisa cuando está lista (con el título de la página) y cuando cambia el idioma. */
  function origenValido(o) {
    return o === ORIGEN_APP || /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o);
  }
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!origenValido(ev.origin) || !d || d.fliitsCitas !== 1) return;
    if (d.tipo === 'listo') {
      ocultarCarga();
      if (typeof d.titulo === 'string' && d.titulo) document.title = d.titulo.slice(0, 120);
    }
    if (d.tipo === 'url' && d.params && typeof d.params === 'object') {
      var q = new URLSearchParams();
      CLAVES.forEach(function (k) {
        var v = d.params[k];
        if (typeof v === 'string' && v && v.length <= 300) q.set(k, v);
      });
      var s = q.toString();
      history.replaceState(null, '', location.pathname + (s ? '?' + s : ''));
    }
  });
})();
</script>
</body>
</html>
